	<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Obvody</title>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <script src="https://cdn.jsdelivr.net/npm/marked/lib/marked.umd.js"></script>
    <style>
        :root {
            --bg: #0f1115;
            --panel: #151820;
            --muted: #9aa4ad;
            --text: #e6e9ee;
            --accent: #4a91ff;
            --border: #282d39;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            min-height: 100%;
        }

        a {
            color: var(--accent);
            text-decoration: none;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        }

        .wrap {
            display: grid;
            grid-template-rows: auto auto 1fr;
            min-height: 100vh;
        }

        header {
            border-bottom: 1px solid var(--border);
            padding: 8px 12px;
        }

        .title {
            color: var(--muted);
        }

        .main {
            display: grid;
            grid-template-columns:10% 1fr 40%;
            gap: 12px;
            padding: 12px;
            min-height: 0;
        }

        .panel {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px;
            gap: 10px;
            overflow-y: auto;
            scrollbar-color: var(--border) transparent;
        }

        .controls {
            color: var(--muted);
            display: block;
            margin-bottom: 8px;
        }

        input[type=number], textarea {
            width: 100%;
            background: #0f131a;
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 8px;
            outline: none;
        }

        textarea {
            flex: 1;
            resize: vertical;
            min-height: 220px;
        }

        .btns {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        button {
            background: #1d2330;
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 8px 10px;
            cursor: pointer;
        }

        button:disabled {
            background: #3e3e3e;
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 8px 10px;
            cursor: not-allowed;
        }

        button:hover:enabled {
            border-color: #3a4254;
        }

        .pc {
            color: var(--muted);
        }

        .programLineHighlight{
            color: var(--accent);
        }

        canvas {
            width: 100%;
            height: 600px;
            min-height: 420px;
            max-width: 100%;
            display: block;
            background: #0f131a;
            border: 1px solid var(--border);
            border-radius: 6px;
            touch-action: none;
        }

        .canvas-tools {
            display: flex;
            gap: 8px;
            margin-top: 8px;
            margin-bottom: 8px;
        }

        .ex-list {
            display: grid;
            grid-template-columns: 1fr;
            gap: 8px;
        }

        .ex-btn {
            text-align: left;
        }

        .info {
            border-bottom: 1px solid var(--border);
            color: var(--muted);
            padding: 8px 12px;
        }

        @media (max-width: 1000px) {
            .main {
                grid-template-columns: 1fr;
            }

            .panel {
                overflow-y: visible;
            }

            canvas {
                height: 100vh;
            }
        }

        .error {
            color: red;
        }
        .finished{
            background-color: forestgreen;
        }


    </style>
    
</head>
<body>
<div class="wrap">
    <header>
        <div class="title">Prask Obvody interaktívka</div>
    </header>
    <div class="info">V tejto úlohe budeš pomáhať Lukášovi pochopiť ženský mozog. Naštastie sa dá celkom dobre predstaviť ako logický obvod.
    </div>
    <div class="main">
        <!-- Left: Exercise list -->
        <section class="panel">
            <div class="ex-list" aria-label="exercises">
                <button class="ex-btn" id="tutorial2" type="button" onclick="loadExercise('tutorial2')">Tutoriál</button>
                <button class="ex-btn" id="zapnutie" type="button" onclick="loadExercise('zapnutie')">Zapnutie</button>
                <button class="ex-btn" id="hodiny" type="button" onclick="loadExercise('hodiny')">Hodiny</button>
                <button class="ex-btn" id="set-reset" type="button" onclick="loadExercise('set-reset')">Set/reset</button>
                <button class="ex-btn" id="prepinac" type="button" onclick="loadExercise('prepinac')">Prepínač</button>
                <button class="ex-btn" id="playground" type="button" onclick="loadExercise('playground')">Playground</button>
            </div>
        </section>

        <section class="panel">
            <canvas width="600" height="600" id="canvas"></canvas>
            <div class="canvas-tools" aria-label="zoom controls">
                <button id="zoom-out" type="button">Zoom -</button>
                <button id="zoom-in" type="button">Zoom +</button>
                <button id="zoom-reset" type="button">Reset pohľadu</button>
            </div>
            <div id="toolbar-view" hidden>
                <button id="start-editing">Upraviť</button>
                <button id="test-circuit">Otestovať</button>
            </div>
            <div id="toolbar-editing">
                <button id="finish-editing">Dokončiť úpravy</button>
                <button id="add-wire">Pridať kábel</button>
                <label>Pridať súčiastku: <select id="add-device">
                    <option value="-1">(žiadnu)</option>
                    <option value="0">vypínač</option>
                    <option value="6">tlačítko</option>
                    <option value="1">žiarovku</option>
                    <option value="2">predlžovačku</option>
                    <option value="3">bránu "nie"</option>
                    <option value="4">bránu "alebo"</option>
                    <option value="5" id="option-add-and-gate">bránu "a"</option>
                </select></label>
                <button id="delete-selected" disabled>Vymazať</button>
                <button id="save">Uložiť</button>
                <button id="export-for-veduci" type="button">Vyexportovať pre vedúcich</button>
                <button id="reload-level">Reset</button>
            </div>
        </section>

        <!-- Center: Exercise text -->
        <section class="panel">
            <div id="exerciseContent">Vyber zadanie</div>
        </section>
    </div>
</div>
</body>
<script src="./script.js"></script>
</html>
